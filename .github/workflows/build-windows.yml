name: Windows portable build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q app.py
      - name: Build portable folder
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name WindowsAutomationAssistant --contents-directory _internal --hidden-import pynput.keyboard._win32 --hidden-import pynput.mouse._win32 --hidden-import pynput._util.win32 app.py
      - name: Prepare portable data folders
        shell: pwsh
        run: |
          $base = "dist/WindowsAutomationAssistant/Data"
          @("Procedures", "Settings", "History", "Logs") | ForEach-Object {
            New-Item -ItemType Directory -Force -Path (Join-Path $base $_) | Out-Null
          }
          @"
          Windows Automation Assistant - Portable
          Avvia WindowsAutomationAssistant.exe da questa cartella.
          Mantieni insieme EXE, _internal e Data.
          "@ | Set-Content "dist/WindowsAutomationAssistant/LEGGIMI.txt"
      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: WindowsAutomationAssistant-portable
          path: dist/WindowsAutomationAssistant/
          if-no-files-found: error
